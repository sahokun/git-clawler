version: 2
# Routine version updates arrive once a month. Each ecosystem gets one grouped PR for
# minor/patch updates and a separate grouped PR for major updates, so compatible updates
# can merge without waiting for the review that majors need.
# They are reminders: re-check the seven-day rule for transitive dependencies and keep
# Tauri Rust/JS versions aligned before merging. Third-party notices are generated by CI.
# The cooldown skips releases younger than seven days, matching the dependency policy.
# Security updates are configured in repository settings, are not grouped and ignore
# the cooldown and the open pull request limit.
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: npm
    directory: /crates/gui
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]

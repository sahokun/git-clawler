version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /crates/gui
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly

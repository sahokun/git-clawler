name: dependency-security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 00:00 UTC
  workflow_dispatch:
  workflow_call:

# Separate from CI/Release concurrency, including when called by Release.
concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.93.1
      - name: Verify reviewed native sources
        run: python3 scripts/test-release-security.py
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-targets: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # cargo install を直接使用（mutable @main ref への依存を避けるため cargo-binstall は採用しない）
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Run cargo audit
        run: python3 scripts/audit-rust.py

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/gui/.nvmrc
      - name: Record Node runtime
        run: |
          node --version
          node -p "process.execPath"
          npm --version
      - working-directory: crates/gui
        run: npm ci
      - name: Test npm audit exception handling
        run: python3 scripts/test-audit-npm.py
      - name: Run npm audit with reviewed exceptions
        run: python3 scripts/audit-npm.py

  dependency-policy:
    name: dependency policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --depth=1 origin "$BASE_SHA"
      - name: Test dependency policy checker
        run: python3 scripts/test-refresh-deps.py
      - name: Check publication age and Tauri alignment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/refresh-deps.py check --base "$BASE_SHA" --markdown "$RUNNER_TEMP/deps.md"
      - name: Publish evidence
        if: always()
        run: cat "$RUNNER_TEMP/deps.md" >> "$GITHUB_STEP_SUMMARY" || true
      # THIRD_PARTY_NOTICES.txt is generated by the release workflow; this catches a
      # crate version without a licence text while the PR is still open.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.93.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/gui/.nvmrc
      - working-directory: crates/gui
        run: npm ci
      - name: Check licence texts for third-party notices
        run: python3 scripts/refresh-deps.py notices

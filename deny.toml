# cargo-deny 設定ファイル
# 例外追加時は必ず以下のコメント形式を使うこと:
# EXCEPTION: <理由> <Issue番号> <期限 YYYY-MM-DD>
#

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # EXCEPTION: crates reachable only through Tauri's Linux GUI dependencies.
  # git-clawler-gui depends on Tauri only on Windows; the Linux CLI/helper do not.
  # `cargo tree --target {x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu,
  # x86_64-unknown-linux-musl}` shows none of these crates (reviewed 2026-11-16).
  # They stay in Cargo.lock, so `cargo audit` (no target filter) still reports them.
  # Tracking: https://github.com/sahokun/git-clawler/issues/5
  # Review expires 2027-04-10. Reevaluate before enabling Linux GUI support.
  # zbus 5: tauri-plugin-notification 2.8.x requires zbus ^5 directly on Linux,
  # so notify-rust 4.19 (zbus 6) alone cannot remove these.
  "RUSTSEC-2026-0370", # zvariant merged into zbus 6
  "RUSTSEC-2026-0371", # zbus_names merged into zbus 6
  "RUSTSEC-2026-0372", # zvariant_derive merged into zbus 6
  # gtk-rs 0.18 (GTK3): tray-icon 0.26 still requires gtk ^0.18 on Linux.
  "RUSTSEC-2024-0429", # glib 0.18 VariantStrIter unsoundness
  "RUSTSEC-2024-0370", # proc-macro-error (unmaintained) via glib-macros 0.18
  # EXCEPTION: chrono is unmaintained (informational, no known vulnerability).
  # Used directly by our crates for UTC timestamps, RFC 3339 and local display.
  # Tracking: https://github.com/sahokun/git-clawler/issues/61 (migrate to jiff)
  # Review expires 2027-02-18.
  "RUSTSEC-2026-0543", # chrono unmaintained
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
